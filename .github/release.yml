# Shapes GitHub's generate-notes enrichment only.
# scripts/release.ts is the published changelog authority.
# skip-changelog hides a PR from both.

changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - chore
    - title: Other
      labels:
        - "*"
