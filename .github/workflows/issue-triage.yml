name: Issue triage

# Issue events load this file from the default branch, not from `dev`.
on:
  issues:
    types:
      - opened
      - edited
      - reopened
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: number

permissions: {}

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install Copilot CLI
        run: npm install --global @github/copilot@1.0.86

      - name: Snapshot open and recently closed issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          closed_since="$(date -u -d '90 days ago' +%Y-%m-%d)"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,body,state > open.json
          gh issue list --repo "$GITHUB_REPOSITORY" --state closed --search "closed:>=${closed_since}" --limit 100 --json number,title,body,state > closed.json

      - name: Nominate related issues; close only on exact shared proof
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        with:
          script: |
            const { runIssueTriage } = require("./.github/scripts/issue-triage-run.cjs");
            await runIssueTriage({ github, context, core, state_reason: "duplicate" });
