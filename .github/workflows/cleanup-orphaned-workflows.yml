# GitHub keeps a sidebar identity for a workflow after its YAML is deleted.
# Deleting every run for that identity lets GitHub drop the stale entry.
#
# No workflow_dispatch: a branch-selected run would receive actions:write.
name: Delete orphaned workflow runs

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-orphaned-workflows.yml"
      - "scripts/ci/cleanup-orphaned-workflows.ts"

permissions:
  contents: read
  actions: write

concurrency:
  group: orphaned-workflow-runs
  cancel-in-progress: false

jobs:
  delete:
    name: Delete orphaned workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Delete completed runs for missing workflow files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types scripts/ci/cleanup-orphaned-workflows.ts
