name: Release

# Maintainer-controlled staged release. scripts/release.ts is the authority.
# package.json on the audited commit must already equal the requested version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "package.json version on the audited commit (example 0.1.0-preview.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag to attach"
        required: true
        type: choice
        options:
          - latest
          - preview
        default: latest
      dry-run:
        description: "Pack and verify only; turn this off to stage or finalize a release"
        required: false
        type: boolean
        default: true
      expected-sha:
        description: "Full commit SHA that was audited; abort if HEAD moved"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted dispatch guard
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted-dispatch

      - name: Validate release dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          node - <<'NODE'
          const { inspectReleaseTrigger } = require(
            "./trusted-dispatch/.github/scripts/release-dispatch-guard.cjs",
          );

          const verdict = inspectReleaseTrigger({
            event: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF,
            auditedSha: process.env.EXPECTED_SHA,
            observedSha: process.env.GITHUB_SHA,
          });

          if (!verdict.ok) {
            console.error(`::error::${verdict.reason}`);
            process.exit(1);
          }
          NODE

  publish:
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # Used only on the post-approval rerun to create tag + GitHub Release
      actions: read # Look up push CI evidence for this SHA
      pull-requests: read # Associated PRs / generate-notes enrichment
      id-token: write # npm trusted staging (OIDC). No npm token.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin to the audited commit
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::error::expected-sha is required; refusing to release without an audited commit"
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::branch moved after the release audit (expected ${EXPECTED_SHA}, got ${GITHUB_SHA}) — refusing to release an unaudited commit"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Staged publishing requires npm >= 11.15.0. Pin an exact npm that
      # contains the staged-publishing CLI and the bundled sigstore fix.
      - name: Pin npm for staged trusted publishing
        run: |
          npm install --global npm@12.0.2
          npm_version="$(npm --version)"
          echo "npm=${npm_version}"
          if [ "$npm_version" != "12.0.2" ]; then
            echo "::error::expected pinned npm 12.0.2, got ${npm_version}"
            exit 1
          fi

      - name: Drop dummy npm token so staging uses OIDC
        run: |
          unset NODE_AUTH_TOKEN || true
          node -e '
            const fs = require("node:fs");
            const file = process.env.NPM_CONFIG_USERCONFIG;
            if (!file || !fs.existsSync(file)) process.exit(0);
            const next = fs.readFileSync(file, "utf8").split(/\r?\n/).filter((line) => !/_authToken/i.test(line)).join("\n");
            fs.writeFileSync(file, next);
          '

      - name: Install dependencies
        run: npm ci

      - name: Stage or finalize Benes release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_DIST_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        run: node --experimental-strip-types scripts/release.ts publish
