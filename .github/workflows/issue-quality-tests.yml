name: Automation tests

on:
  pull_request:
    paths:
      - ".github/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, preview, dev]
    paths:
      - ".github/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: automation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Run repository automation tests
        run: node .github/scripts/run-automation-tests.cjs
