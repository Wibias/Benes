name: Automation tests

on:
  pull_request:
    paths:
      - ".github/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, preview, dev]
    paths:
      - ".github/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: automation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run repository automation tests
        run: node .github/scripts/run-automation-tests.cjs
